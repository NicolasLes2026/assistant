<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5fbf">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Mon assistant</title>
<style>
:root{--bg:#eef2f4;--surf:#fff;--ink:#14232b;--mut:#5d6f78;--line:#d5dde1;--acc:#1f5fbf;--accink:#fff;--warn:#c8374b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e191f;--surf:#162830;--ink:#e8f0f3;--mut:#93a8b1;--line:#2a3f49;--acc:#6fa8ff;--accink:#0e191f;--warn:#ff7a8b;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px)}
main{max-width:560px;margin:0 auto;padding:16px 14px 100px}
h1{font-size:26px;margin:0 0 12px;letter-spacing:-.02em;text-transform:capitalize}
h2{font-size:17px;margin:20px 0 8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 2px;background:none;border:0;color:var(--mut);font:600 13px inherit;font-family:inherit;cursor:pointer}
nav button[aria-selected="true"]{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.card,.item{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0;flex:1 1 110px;width:100%}
textarea{min-height:90px;resize:vertical}
:is(input,select,textarea,button):focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:10px 14px;font:600 15px inherit;font-family:inherit;cursor:pointer;flex:none}
.g{background:none;color:var(--ink);border:1px solid var(--line)}
.x{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer;padding:2px 8px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px}
.item>div{flex:1;min-width:0;overflow-wrap:anywhere}
.item small,.m{color:var(--mut);display:block;font-size:13px}
.item.dn .tx{text-decoration:line-through;opacity:.55}
.item input[type=checkbox]{flex:none;width:22px;height:22px;accent-color:var(--acc)}
.mn{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
.mn strong{text-transform:capitalize}
.pb{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 10px}
.pb i{display:block;height:100%;background:var(--acc)}
.big{font-size:28px;font-weight:800;letter-spacing:-.02em}
.mood{font-size:24px;background:none;border:2px solid transparent;border-radius:10px;cursor:pointer;padding:4px 8px}
.mood[aria-pressed="true"]{border-color:var(--acc)}
.w{color:var(--warn);font-weight:600}
.e{color:var(--mut);padding:8px 0}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<input type="file" id="imp" accept="application/json" hidden>
<script>
const K='assistant-v2';
let S={sess:[],plans:{},wt:[],dates:[],stock:[],day:{d:'',items:[]},ideas:[],tried:[],jr:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),V=id=>($('#'+id)||{}).value||'';
const uid=()=>Math.random().toString(36).slice(2,9),pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const fd=(s,o)=>new Date(s+'T12:00').toLocaleDateString('fr-FR',o||{weekday:'short',day:'numeric',month:'short'});
const num=s=>parseFloat(String(s).replace(',','.'));
const fr=n=>String(Math.round(n*100)/100).replace('.',',');
function dur(s){const p=s.trim().replace(',','.').split(':').map(Number);if(!s.trim()||p.some(isNaN))return NaN;return p.length===1?p[0]:p.length===2?p[0]+p[1]/60:p[0]*60+p[1]+p[2]/60}
function fdur(m){const t=Math.round(m*60),h=Math.floor(t/3600);return h?`${h} h ${pad(Math.floor(t%3600/60))}`:`${Math.floor(t/60)}:${pad(t%60)}`}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

/* Nouveau jour : les tâches non faites retournent dans la liste générale */
(function(){const t=today();if(S.day.d!==t){S.day.items.filter(x=>!x.done).forEach(x=>S.stock.push({id:x.id,text:x.text}));S.day={d:t,items:[]};save()}})();

let tab='j',mo=today().slice(0,7),mood='';
const TABS=[['j','Jour'],['s','Sport'],['t','To do'],['i','Idées'],['a','Agenda'],['n','Journal']];
const TYPES=['Course','Renforcement','Vélo','Marche','Natation','Autre'],CATS=['Lecture','Sortie','Recette'],MOODS=['😞','😐','🙂','😄'];
const DUE=3*864e5;
const dueIdeas=()=>S.ideas.filter(x=>Date.now()-x.last>=DUE);
function nxt(x){const [y,m,d]=x.date.split('-').map(Number),n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());let a=new Date(x.yearly?n.getFullYear():y,m-1,d);if(x.yearly&&a<t0)a=new Date(n.getFullYear()+1,m-1,d);return Math.round((a-t0)/864e5)}
const inDays=n=>n===0?'aujourd’hui':n===1?'demain':n<0?'passé':`dans ${n} j`;
const mnav=()=>`<div class="mn"><button class="btn g" data-a="pm" data-i="-1" aria-label="Mois précédent">‹</button><strong>${fd(mo+'-01',{month:'long',year:'numeric'})}</strong><button class="btn g" data-a="pm" data-i="1" aria-label="Mois suivant">›</button></div>`;
const dayItems=()=>S.day.items.map(x=>`<div class="item ${x.done?'dn':''}"><input type="checkbox" data-a="dchk" data-i="${x.id}" ${x.done?'checked':''} aria-label="Fait"><div class="tx">${esc(x.text)}</div><button class="x" data-a="dback" data-i="${x.id}" title="Remettre dans la liste générale" aria-label="Remettre dans la liste générale">↩</button></div>`).join('');
function spark(v){if(v.length<2)return '';const a=Math.min(...v),b=Math.max(...v),r=b-a||1;return `<svg viewBox="0 0 300 80" width="100%" role="img" aria-label="Courbe de poids"><polyline points="${v.map((y,i)=>`${5+i/(v.length-1)*290},${70-(y-a)/r*60}`).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/></svg>`}

function vJ(){
  const due=dueIdeas(),soon=S.dates.map(x=>({...x,n:nxt(x)})).filter(x=>x.n>=0&&x.n<=14).sort((a,b)=>a.n-b.n);
  return `<h1>${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</h1>
  <h2>To do du jour</h2>${S.day.items.length?dayItems():`<div class="card">Ta journée est vide.<br><br><button class="btn" data-a="tab" data-i="t">Choisir mes tâches</button></div>`}
  ${due.length?`<h2>As-tu eu le temps d’essayer ?</h2>`+due.map(x=>`<div class="card"><b>${esc(x.text)}</b><span class="m">${x.cat}</span><div class="row" style="margin-top:8px"><button class="btn" data-a="itry" data-i="${x.id}">Oui, essayé</button><button class="btn g" data-a="ikeep" data-i="${x.id}">Non, je garde</button><button class="btn g" data-a="idrop" data-i="${x.id}">Non, j’abandonne</button></div></div>`).join(''):''}
  ${soon.length?`<h2>Dates à venir</h2>`+soon.map(x=>`<div class="item"><div>${esc(x.title)}<small>${fd(x.date)}</small></div><b>${inDays(x.n)}</b></div>`).join(''):''}
  ${new Date().getHours()>=18&&!S.jr[today()]?`<div class="card">Ta pensée du soir n’est pas écrite.<br><br><button class="btn" data-a="tab" data-i="n">Écrire</button></div>`:''}
  <h2>Mes données</h2><div class="row"><button class="btn g" data-a="xall">Exporter tout</button><button class="btn g" data-a="imp">Importer</button></div>
  <p class="m">Tout est stocké sur ce téléphone. Exporte de temps en temps pour garder une sauvegarde.</p>`;
}
function vS(){
  const es=S.sess.filter(x=>x.date.startsWith(mo)).sort((a,b)=>b.date.localeCompare(a.date)),P=S.plans[mo]||{};
  const km=es.reduce((s,x)=>s+(x.dist||0),0),mn=es.reduce((s,x)=>s+x.min,0);
  const w=[...S.wt].sort((a,b)=>a.date.localeCompare(b.date)),l=w[w.length-1],p=w[w.length-2];
  const bar=(v,t)=>t?`<div class="pb"><i style="width:${Math.min(100,v/t*100)}%"></i></div>`:'';
  return `<h1>Sport</h1>
  <div class="card"><div class="row"><input id="sd" type="date" value="${today()}" aria-label="Date"><select id="st" aria-label="Type">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select>
  <input id="sk" type="number" step="0.01" min="0" inputmode="decimal" placeholder="km (facultatif)"><input id="sm" placeholder="Durée (32 ou 32:30)"><input id="sn" placeholder="Note (facultatif)"><button class="btn" data-a="sadd">Ajouter</button></div></div>
  ${mnav()}
  <div class="card"><b>Plan du mois</b>
  <div class="row" style="margin:8px 0"><input id="pn" type="number" min="0" inputmode="numeric" placeholder="Séances visées" value="${P.n||''}"><input id="pk" type="number" min="0" inputmode="decimal" placeholder="km visés" value="${P.k||''}"><button class="btn g" data-a="plan">Enregistrer</button></div>
  <span class="m">Séances : ${es.length}${P.n?' / '+P.n:''}</span>${bar(es.length,P.n)}
  <span class="m">Distance : ${fr(km)} km${P.k?' / '+P.k+' km':''}</span>${bar(km,P.k)}
  <span class="m">Temps total : ${mn?fdur(mn)+' (h:min)':'–'}</span></div>
  ${es.length?es.map(x=>`<div class="item"><div><b>${x.type}</b> ${x.dist?fr(x.dist)+' km · ':''}${fdur(x.min)}${x.dist&&x.type==='Course'?' · '+fdur(x.min/x.dist)+' min/km':''}<small>${fd(x.date)}${x.note?' · '+esc(x.note):''}</small></div><button class="x" data-a="sdel" data-i="${x.id}" aria-label="Supprimer">×</button></div>`).join(''):'<p class="e">Aucune séance ce mois-ci.</p>'}
  <h2>Poids</h2><div class="card"><div class="row"><input id="wd" type="date" value="${today()}" aria-label="Date"><input id="wk" type="number" step="0.1" inputmode="decimal" placeholder="kg"><button class="btn" data-a="wadd">Ajouter</button></div>
  ${l?`<div style="margin-top:10px"><span class="big">${fr(l.kg)} kg</span> <span class="m" style="display:inline">${p?(l.kg-p.kg>0?'+':'')+fr(l.kg-p.kg)+' depuis la mesure précédente':''}</span></div>${spark(w.slice(-30).map(x=>x.kg))}`:''}</div>
  ${[...w].reverse().slice(0,5).map(x=>`<div class="item"><div>${fr(x.kg)} kg<small>${fd(x.date)}</small></div><button class="x" data-a="wdel" data-i="${x.id}" aria-label="Supprimer">×</button></div>`).join('')}`;
}
function vT(){
  return `<h1>To do</h1><h2>Aujourd’hui</h2>${S.day.items.length?dayItems():'<p class="e">Rien de choisi. Ajoute des tâches depuis la liste générale.</p>'}
  <h2>Liste générale</h2><div class="card"><div class="row"><input id="tx" placeholder="Nouvelle tâche" maxlength="150"><button class="btn" data-a="tadd">Ajouter</button></div></div>
  ${S.stock.length?S.stock.map(x=>`<div class="item"><div>${esc(x.text)}</div><button class="btn g" data-a="tday" data-i="${x.id}">Aujourd’hui</button><button class="x" data-a="tdel" data-i="${x.id}" aria-label="Supprimer">×</button></div>`).join(''):'<p class="e">Liste vide.</p>'}
  <button class="btn g" data-a="xtodo" style="margin-top:8px">Exporter en texte</button>
  <p class="m">Chaque nouvelle journée, les tâches non faites reviennent dans la liste générale.</p>`;
}
function vI(){
  const hist=S.tried.length;
  return `<h1>Idées</h1><div class="card"><div class="row"><select id="ic" aria-label="Catégorie">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><input id="ix" placeholder="Un livre, un lieu, une recette..." maxlength="150"><button class="btn" data-a="iadd">Ajouter</button></div></div>
  ${CATS.map(c=>{const l=S.ideas.filter(x=>x.cat===c);return `<h2>${c}s</h2>`+(l.length?l.map(x=>`<div class="item"><div>${esc(x.text)}<small>${Date.now()-x.last>=DUE?'<span class="w">À relancer</span>':'ajouté le '+fd(new Date(x.added).toISOString().slice(0,10))}</small></div><button class="btn g" data-a="itry" data-i="${x.id}">Essayé</button><button class="x" data-a="idel" data-i="${x.id}" aria-label="Supprimer">×</button></div>`).join(''):'<p class="e">Rien pour l’instant.</p>')}).join('')}
  <h2>Déjà essayé (${hist})</h2>${S.tried.slice().reverse().map(x=>`<div class="item"><div>${esc(x.text)}<small>${x.cat} · ${fd(x.on)}</small></div></div>`).join('')}`;
}
function vA(){
  const l=S.dates.map(x=>({...x,n:nxt(x)})).sort((a,b)=>(a.n<0)-(b.n<0)||(a.n<0?b.n-a.n:a.n-b.n));
  return `<h1>Agenda</h1><div class="card"><div class="row"><input id="at" placeholder="Ex. : anniversaire de Léa" maxlength="80"><input id="ad" type="date" value="${today()}" aria-label="Date"><label class="row" style="flex:none"><input type="checkbox" id="ay" style="width:20px;flex:none"> Chaque année</label><button class="btn" data-a="aadd">Ajouter</button></div></div>
  ${l.length?l.map(x=>`<div class="item ${x.n<0?'dn':''}"><div class="tx">${esc(x.title)}<small>${fd(x.date,{weekday:'short',day:'numeric',month:'long',year:'numeric'})}${x.yearly?' · chaque année':''}</small></div><b>${inDays(x.n)}</b><button class="x" data-a="adel" data-i="${x.id}" aria-label="Supprimer">×</button></div>`).join(''):'<p class="e">Aucune date. Ajoute la première.</p>'}`;
}
function vN(){
  const t=today(),cur=S.jr[t]||{},ks=Object.keys(S.jr).sort().reverse();let m='';
  return `<h1>Journal</h1><div class="card"><b>Une pensée pour aujourd’hui</b><div class="row" style="margin:8px 0">${MOODS.map(x=>`<button class="mood" data-a="mood" data-i="${x}" aria-pressed="${(mood||cur.mood)===x}" aria-label="Humeur ${x}">${x}</button>`).join('')}</div>
  <textarea id="jt" placeholder="Ressenti, idée, moment important...">${esc(cur.text||'')}</textarea><button class="btn" data-a="nsave" style="margin-top:8px">Enregistrer</button></div>
  ${ks.map(k=>{let h='';if(k.slice(0,7)!==m){m=k.slice(0,7);h=`<h2 style="text-transform:capitalize">${fd(m+'-01',{month:'long',year:'numeric'})}</h2>`}return h+`<div class="item"><div>${esc(S.jr[k].text)}<small>${fd(k)} ${S.jr[k].mood||''}</small></div></div>`}).join('')||'<p class="e">Ton journal se remplira ici.</p>'}`;
}
function R(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button data-a="tab" data-i="${k}" aria-selected="${k===tab}">${l}</button>`).join('');$('#app').innerHTML=({j:vJ,s:vS,t:vT,i:vI,a:vA,n:vN})[tab]()}
const del=(k,i)=>{S[k]=S[k].filter(x=>x.id!==i);save();R()};
const A={
 tab:i=>{tab=i;scrollTo(0,0);R()},
 pm:i=>{const [y,m]=mo.split('-').map(Number),d=new Date(y,m-1+Number(i),1);mo=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;R()},
 sadd:()=>{const d=V('sd'),m=dur(V('sm')),k=V('sk')?num(V('sk')):0;if(!d||!(m>0)){alert('Renseigne la date et la durée (ex. 32 ou 32:30).');return}S.sess.push({id:uid(),date:d,type:V('st'),dist:k>0?k:0,min:m,note:V('sn').trim()});mo=d.slice(0,7);save();R()},
 sdel:i=>del('sess',i),
 plan:()=>{S.plans[mo]={n:num(V('pn'))||0,k:num(V('pk'))||0};save();R()},
 wadd:()=>{const k=num(V('wk'));if(!(k>0)){alert('Entre ton poids en kg.');return}S.wt.push({id:uid(),date:V('wd')||today(),kg:k});save();R()},
 wdel:i=>del('wt',i),
 tadd:()=>{const t=V('tx').trim();if(!t)return;S.stock.push({id:uid(),text:t});save();R()},
 tday:i=>{const x=S.stock.find(y=>y.id===i);S.stock=S.stock.filter(y=>y.id!==i);S.day.items.push({id:x.id,text:x.text,done:false});save();R()},
 tdel:i=>del('stock',i),
 dchk:i=>{const x=S.day.items.find(y=>y.id===i);x.done=!x.done;save();R()},
 dback:i=>{const x=S.day.items.find(y=>y.id===i);S.day.items=S.day.items.filter(y=>y.id!==i);S.stock.push({id:x.id,text:x.text});save();R()},
 xtodo:()=>dl('todo-'+today()+'.txt',['À faire aujourd’hui :',...S.day.items.map(x=>`[${x.done?'x':' '}] ${x.text}`),'','Liste générale :',...S.stock.map(x=>'- '+x.text)].join('\n'),'text/plain'),
 iadd:()=>{const t=V('ix').trim();if(!t)return;S.ideas.push({id:uid(),cat:V('ic'),text:t,added:Date.now(),last:Date.now()});save();R()},
 itry:i=>{const x=S.ideas.find(y=>y.id===i);S.tried.push({...x,on:today()});del('ideas',i)},
 ikeep:i=>{S.ideas.find(y=>y.id===i).last=Date.now();save();R()},
 idrop:i=>del('ideas',i),idel:i=>del('ideas',i),
 aadd:()=>{const t=V('at').trim(),d=V('ad');if(!t||!d)return;S.dates.push({id:uid(),title:t,date:d,yearly:$('#ay').checked});save();R()},
 adel:i=>del('dates',i),
 mood:i=>{mood=i;const t=V('jt');S.jr[today()]={...(S.jr[today()]||{}),text:t,mood:i};if(!t)delete S.jr[today()];R()},
 nsave:()=>{const t=V('jt').trim();if(!t){alert('Écris quelque chose avant d’enregistrer.');return}S.jr[today()]={text:t,mood:mood||(S.jr[today()]||{}).mood||''};save();R()},
 xall:()=>dl('assistant-sauvegarde-'+today()+'.json',JSON.stringify(S),'application/json'),
 imp:()=>$('#imp').click()
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.i)});
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(confirm('Remplacer les données actuelles par cette sauvegarde ?')){S=Object.assign(S,d);save();R()}}catch(x){alert('Fichier invalide.')}};r.readAsText(f);e.target.value=''};
R();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
